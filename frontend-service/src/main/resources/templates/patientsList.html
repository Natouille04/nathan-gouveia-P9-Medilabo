<!DOCTYPE html>
<html lang="fr" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre des Patients</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --info-color: #44ef52;
            --info-hover: #1ead25;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.5rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        th:last-child,
        td:last-child {
            width: 1%;
            white-space: nowrap;
            text-align: right;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: flex-end;
        }

        .btn {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background-color: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
        }

        .btn-edit:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-create {
            background-color: #eff6ff;
            color: var(--primary-color);
            border: 1px solid #bfdbfe;
            margin-bottom: 25px;
        }

        .btn-create:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-details {
            background-color: #f4fef2;
            color: var(--info-color);
            border: 1px solid #cafeca;
        }

        .btn-details:hover {
            background-color: var(--info-color);
            color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Registre des Patients</h2>

        <a class="btn btn-create" href="/patients/new">Ajouter un nouveau patient</a>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Prénom</th>
                        <th>Nom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.firstName}">Prénom</td>
                        <td th:text="${patient.lastName}">Nom</td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-details">Details</a>
                                <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-edit">Modifier</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>
