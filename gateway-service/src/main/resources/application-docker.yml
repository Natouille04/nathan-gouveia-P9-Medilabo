spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://patient-service:8082
              predicates:
                - Path=/patient/**
                
            - id: note-service
              uri: http://notes-service:8083
              predicates:
                - Path=/notes/**

            - id: risk-service
              uri: http://risk-service:8084
              predicates:
                - Path=/risk/**