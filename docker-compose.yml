services:
  mongo-notes:
    image: mongo:8.0
    container_name: mongo-notes
    ports:
      - "27017:27017"
    networks:
      - medilabo-network
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-patient:
    image: mysql:8.0
    container_name: mysql-patient
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: patient_db
    ports:
      - "3306:3306"
    networks:
      - medilabo-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootroot"]
      interval: 5s
      timeout: 5s
      retries: 10

  patient-service:
    build: ./patient-service
    container_name: patient-service
    restart: on-failure
    depends_on:
      mysql-patient:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-patient:3306/patient_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootroot
    networks:
      - medilabo-network

  notes-service:
    build: ./notes-service
    container_name: notes-service
    restart: on-failure
    depends_on:
      mongo-notes:
        condition: service_healthy
    environment:
      SPRING_MONGODB_URI: mongodb://mongo-notes:27017/notes_db
    networks:
      - medilabo-network

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: on-failure
    depends_on:
      patient-service:
        condition: service_started
      notes-service:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    networks:
      - medilabo-network

  frontend-service:
    build: ./frontend-service
    container_name: frontend-service
    restart: on-failure
    depends_on:
      gateway-service:
        condition: service_started
    environment:
      GATEWAY_URL: http://gateway-service:8081
    ports:
      - "8080:8080"
    networks:
      - medilabo-network

networks:
  medilabo-network: